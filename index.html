<!DOCTYPE html>
<html>
<head>
<style>
body {
    background-color: rgb(50, 47, 79);
    color: rgb(187, 135, 255);
}
button {
    background-color: rgb(50, 47, 79);
    color: rgb(187, 135, 255);
}
.italic {
    font-style: italic;
}
.hidden {
    visibility: hidden;
}
.visible {
    visibility: visible;
}
</style>
</head>
<body>
<div>
<span id="disT">made entirely on a steam deck</span>
<span id="distI" class="italic"></span>
<span id="two"></span>
<br>
<br>
</div>
<button id="disB">click</button>
<input id="name" type="text" class="hidden">

<script>
const disT = document.getElementById("disT");
const distI = document.getElementById("distI");
const dist2 = document.getElementById("two");
const disB = document.getElementById("disB");
const name = document.getElementById("name");
const hidden = document.getElementsByClassName("hidden");
let usrName = "";
let disP = "";
let dispI ="";
let disp2 = "";
let dispB = "";
let menu = true;
let i = 0;
disB.addEventListener("click", function () {
    if (i === 0) {
        disP = "Welcome!";
        dispB = "...";
        ++i;
    } else if (i === 1) {
        disP = "...Hello?";
        dispB = "Hello.";
        ++i;
    } else if (i === 2) {
        disP = "Wonderful, you're here!";
        dispB = "...";
        ++i;
    } else if (i === 3) {
        disP = "That's something special, you know? ";
        dispI = "You're";
        disp2 = " here.";
        dispB = "...";
        ++i;
    } else if (i === 4) {
        dispI = "";
        disp2 = "";
        disP = "Wait...";
        dispB = "...";
        ++i;
    } else if (i === 5) {
        disP = "Who are you?";
        name.classList.remove("hidden");
        dispB = "...";
        ++i;
    } else if (i === 6) {
        usrName = name.value;
        name.classList.add("hidden");
        disP = `${usrName} huh? nice to meet you <3`;
        dispB = "...";
    }
    
    disT.textContent = disP;
    disB.textContent = dispB;
    distI.textContent = dispI;
    dist2.textContent = disp2;
})
</script>

</body>
</html>
